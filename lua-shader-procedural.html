<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060c">
<title>Lua — shader procedural</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    background: #04060c;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #gl {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #title {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    color: #8b96c9;
    font: 11px/1.4 system-ui, sans-serif;
    letter-spacing: 0.02em;
    pointer-events: none;
    text-shadow: 0 1px 8px #04060c;
  }
  #panel {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px 14px;
    background: rgba(8,12,22,.62);
    border: 1px solid rgba(120,150,255,.18);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font: 12px/1.4 system-ui, sans-serif;
    color: #cdd6f4;
    user-select: none;
    touch-action: manipulation;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl.full { grid-column: 1 / -1; }
  .ctl label {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: #8b96c9;
    font-size: 11px;
  }
  #phaseName { color: #cdd6f4; font-weight: 500; }
  input[type=range] {
    width: 100%;
    height: 28px;
    margin: 0;
    accent-color: #93a7ff;
    touch-action: manipulation;
  }
  button {
    width: 100%;
    background: #1b2340;
    color: #cdd6f4;
    border: 1px solid rgba(120,150,255,.25);
    border-radius: 10px;
    padding: 12px 12px;
    font: 13px system-ui;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { background: #252f55; }
  #err {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 200px;
    display: none;
    color: #ff9f9f;
    font: 11px/1.5 monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="title">🌕 LUA · 100% procedural (GLSL, sem texturas)</div>
<div id="panel">
  <div class="ctl full">
    <label>Fase da lua <span id="phaseName"></span></label>
    <input id="phase" type="range" min="0" max="6.2832" step="0.001" value="1.15">
  </div>
  <div class="row">
    <div class="ctl">
      <label>Zoom</label>
      <input id="zoom" type="range" min="2.6" max="4.6" step="0.01" value="3.35">
    </div>
    <div class="ctl">
      <label>Rotação</label>
      <input id="speed" type="range" min="-2" max="2" step="0.01" value="0.15">
    </div>
  </div>
  <button id="seed">Nova semente</button>
</div>
<div id="err"></div>

<script>
const canvas = document.getElementById('gl');
const errEl  = document.getElementById('err');
const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;
uniform float uTime;
uniform float uClock;
uniform float uPhase;
uniform float uZoom;
uniform float uSeed;

float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
vec3 hash33(vec3 p){
  p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),
           dot(p, vec3(269.5, 183.3, 246.1)),
           dot(p, vec3(113.5, 271.9, 124.6)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  float a = hash13(i);                       float b = hash13(i + vec3(1.0,0.0,0.0));
  float c = hash13(i + vec3(0.0,1.0,0.0));   float d = hash13(i + vec3(1.0,1.0,0.0));
  float e = hash13(i + vec3(0.0,0.0,1.0));   float g = hash13(i + vec3(1.0,0.0,1.0));
  float h = hash13(i + vec3(0.0,1.0,1.0));   float k = hash13(i + vec3(1.0,1.0,1.0));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y),
             mix(mix(e,g,u.x), mix(h,k,u.x), u.y), u.z);
}
float fbm(vec3 p){
  float s = 0.0, amp = 0.5;
  for (int i = 0; i < 4; i++){
    s += amp * vnoise(p);
    p  = p * 2.03 + 17.19;
    amp *= 0.5;
  }
  return s;
}

float craterLayer(vec3 p, float scale, float density, float amp){
  vec3 q  = p * scale;
  vec3 id = floor(q);
  vec3 f  = fract(q) - 0.5;
  if (hash13(id + vec3(3.31 + uSeed * 3.7)) > density) return 0.0;
  vec3  rn = hash33(id + vec3(uSeed));
  float r  = 0.17 + 0.13 * hash13(id + 9.77);
  float x  = length(f - rn * 0.20) / r;
  if (x > 1.35) return 0.0;
  float bowl = -pow(max(1.0 - x, 0.0), 1.8);
  float ring = 0.32 * pow(clamp(1.0 - abs(x - 1.05) / 0.16, 0.0, 1.0), 2.0);
  float e    = max(max(abs(f.x), abs(f.y)), abs(f.z));
  float fade = smoothstep(0.5, 0.455, e);
  return (bowl + ring) * amp * fade;
}

float height(vec3 p){
  float h = 0.0;
  h += (fbm(p * 3.1 + 10.0) - 0.5) * 0.50;
  h += (fbm(p * 8.7 + 50.0) - 0.5) * 0.20;
  h += craterLayer(p,  5.0, 0.24, 0.55);
  h += craterLayer(p,  9.5, 0.30, 0.30);
  h += craterLayer(p, 16.0, 0.40, 0.15);
  return h;
}

vec3 albedoAt(vec3 p){
  float maria = smoothstep(0.50, 0.60, fbm(p * 1.7 + 33.0));
  float speck = (fbm(p * 22.0 + 71.0) - 0.5) * 0.10;
  vec3 col = mix(vec3(0.76, 0.74, 0.70), vec3(0.34, 0.33, 0.32), maria) + speck;
  return clamp(col, 0.0, 1.0);
}

vec3 sky(vec3 rd){
  vec3 col = mix(vec3(0.003,0.005,0.011), vec3(0.012,0.016,0.030),
                 smoothstep(-1.0, 1.0, rd.y) * 0.6 + 0.2);
  for (int i = 0; i < 2; i++){
    float s  = (i == 0) ? 60.0 : 120.0;
    float th = (i == 0) ? 0.990 : 0.996;
    float sz = (i == 0) ? 0.16 : 0.10;
    float br = (i == 0) ? 1.00 : 0.70;
    vec3  q  = rd * s + vec3(uSeed * 7.31);
    vec3  id = floor(q);
    vec3  f  = fract(q) - 0.5;
    if (hash13(id + 1.27) > th){
      vec3  rn = hash33(id + 2.91);
      float d  = length(f - rn * 0.42);
      float tw = 0.55 + 0.45 * sin(uClock * (1.5 + 2.5 * hash13(id + 0.7)) + hash13(id + 5.5) * 40.0);
      col += smoothstep(sz, 0.0, d) * tw * br
           * mix(vec3(0.80,0.85,1.00), vec3(1.00,0.92,0.75), hash13(id + 8.2));
    }
  }
  return col;
}

vec3 rotY(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(c*v.x + s*v.z, v.y, -s*v.x + c*v.z); }
vec3 rotZ(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(c*v.x - s*v.y, s*v.x + c*v.y, v.z); }

void main(){
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / max(uRes.y, 1.0);
  uv.y -= 0.22;
  vec3 ro = vec3(0.0, 0.0, uZoom);
  vec3 rd = normalize(vec3(uv * 0.85, -1.0));

  vec3 sun   = normalize(vec3(cos(uPhase), 0.22, sin(uPhase)));
  vec3 earth = normalize(vec3(0.15, 0.10, 1.0));

  float b  = dot(ro, rd);
  float c  = dot(ro, ro) - 1.0;
  float h2 = b * b - c;

  vec3 col = vec3(0.0);
  if (h2 > 0.0){
    float t = -b - sqrt(h2);
    vec3 p  = ro + t * rd;

    vec3 po = rotZ(rotY(p, -uTime), 0.14);
    vec3 no = normalize(po);

    vec3 axis = (abs(no.y) < 0.9) ? vec3(0.0,1.0,0.0) : vec3(1.0,0.0,0.0);
    vec3 tv = normalize(cross(no, axis));
    vec3 bv = cross(no, tv);
    float eps = 0.02, bump = 0.02;
    vec3 n1 = normalize(no + tv * eps);
    vec3 n2 = normalize(no + bv * eps);
    vec3 d0 = no * (1.0 + bump * height(no));
    vec3 d1 = n1 * (1.0 + bump * height(n1));
    vec3 d2 = n2 * (1.0 + bump * height(n2));
    vec3 nobj = normalize(cross(d1 - d0, d2 - d0));
    if (dot(nobj, no) < 0.0) nobj = -nobj;
    vec3 n = rotY(rotZ(nobj, -0.14), uTime);

    vec3 alb  = albedoAt(po);
    float diff = max(dot(n, sun), 0.0);
    float shin = max(dot(n, earth), 0.0);

    vec3 lig = alb * 0.012;
    lig += alb * diff * vec3(1.06, 1.00, 0.94);
    lig += alb * shin * 0.09 * vec3(0.45, 0.60, 1.00);
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
    lig += rim * diff * 0.10 * vec3(1.0, 0.97, 0.90);

    col = lig;
  } else {
    col = sky(rd);
  }

  col = pow(col, vec3(0.4545));
  gl_FragColor = vec4(col, 1.0);
}
`;

const gl = canvas.getContext('webgl', { antialias:false, alpha:false, preserveDrawingBuffer:true })
        || canvas.getContext('experimental-webgl', { antialias:false, alpha:false });
if (!gl){ errEl.style.display='block'; errEl.textContent='WebGL não está disponível neste navegador.'; throw new Error('no webgl'); }

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error(log);
    errEl.style.display='block';
    errEl.textContent = 'Erro no shader:\n' + log;
    throw new Error(log);
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 aP; void main(){ gl_Position = vec4(aP, 0.0, 1.0); }'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('link falhou');
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(gl.getAttribLocation(prog, 'aP'));
gl.vertexAttribPointer(gl.getAttribLocation(prog, 'aP'), 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uClock','uPhase','uZoom','uSeed'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

const state = { phase:1.15, zoom:3.35, speed:0.15, seed:7.31 };
let angle = 0, last = performance.now();

function resize(){
  const vv = window.visualViewport;
  const cssW = Math.max(1, Math.floor((vv && vv.width)  || innerWidth  || document.documentElement.clientWidth));
  const cssH = Math.max(1, Math.floor((vv && vv.height) || innerHeight || document.documentElement.clientHeight));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(cssW * dpr));
  const h = Math.max(1, Math.floor(cssH * dpr));
  if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 80));

const phaseEl = document.getElementById('phase');
const zoomEl  = document.getElementById('zoom');
const speedEl = document.getElementById('speed');
const nameEl  = document.getElementById('phaseName');

function phaseName(p){
  const P = Math.PI;
  const ang = (x, y) => { const d = Math.abs(x - y) % (2*P); return Math.min(d, 2*P - d); };
  if (ang(p, 0)     < 0.35) return 'Quarto crescente';
  if (ang(p, P/2)   < 0.35) return 'Lua cheia';
  if (ang(p, P)     < 0.35) return 'Quarto minguante';
  if (ang(p, 3*P/2) < 0.35) return 'Lua nova';
  if (p < P/2)      return 'Gibosa crescente';
  if (p < P)        return 'Gibosa minguante';
  if (p < 3*P/2)    return 'Minguante (fininha)';
  return 'Crescente (fininha)';
}
phaseEl.addEventListener('input', () => { state.phase = parseFloat(phaseEl.value); nameEl.textContent = phaseName(state.phase); });
nameEl.textContent = phaseName(state.phase);
zoomEl.addEventListener('input',  () => state.zoom  = parseFloat(zoomEl.value));
speedEl.addEventListener('input', () => state.speed = parseFloat(speedEl.value));
document.getElementById('seed').addEventListener('click', () => state.seed = Math.random() * 1000.0);

document.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, { passive:false });

function frame(now){
  resize();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  angle += dt * state.speed;

  gl.uniform2f(U.uRes,   canvas.width, canvas.height);
  gl.uniform1f(U.uTime,  angle);
  gl.uniform1f(U.uClock, now / 1000);
  gl.uniform1f(U.uPhase, state.phase);
  gl.uniform1f(U.uZoom,  state.zoom);
  gl.uniform1f(U.uSeed,  state.seed);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
