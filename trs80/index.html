document.getElementById("load").onclick = function() { trsEmu.run(macro); trsEmu.run("256MHz"); };
document.getElementById("fast").onclick = function() { trsEmu.run("256MHz"); };
document.getElementById("rst").onclick = function() { trsEmu.run("reset"); };
var keyQueue = [];
var keyBusy = false;
function enqueueKeys(text) {
  for (var i = 0; i < text.length; i++) keyQueue.push(text.charAt(i));
  trsEmu.run("4MHz");
  pumpKeys();
}
function pumpKeys() {
  if (keyBusy || !keyQueue.length) return;
  var ch = keyQueue.shift();
  if (ch === "\n") ch = "\r";
  if (ch >= "A" && ch <= "Z") ch = ch.toLowerCase();
  var z = trsEmu.trs80;
  var kbd = z.dev && z.dev.kbd;
  if (!kbd) return;
  keyBusy = true;
  kbd.ascii_down(z, ch);
  setTimeout(function() {
    kbd.ascii_up(z, ch);
    keyBusy = false;
    if (!keyQueue.length) trsEmu.run("64MHz");
    else pumpKeys();
  }, 25);
}
var keys = document.getElementById("keys");
document.getElementById("kbd").onclick = function() {
  trsEmu.focus();
  keys.focus();
};
keys.addEventListener("keydown", function(e) {
  if (e.key === "Enter") { e.preventDefault(); enqueueKeys("\r"); keys.value = ""; }
  else if (e.key === "Backspace") { e.preventDefault(); enqueueKeys("\x08"); }
});
keys.addEventListener("input", function() {
  var v = keys.value;
  keys.value = "";
  if (v) enqueueKeys(v);
});
window.addEventListener("load", boot);
