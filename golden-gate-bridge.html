<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Golden Gate Bridge — Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87a8c9; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
// Simple orbit-style controls (no external dependency)
function SimpleControls(camera, domElement) {
  this.camera = camera;
  this.domElement = domElement;
  this.target = new THREE.Vector3(0, 50, 0);
  this.enableDamping = true;
  this.dampingFactor = 0.05;
  this.minDistance = 80;
  this.maxDistance = 900;
  this.maxPolarAngle = Math.PI * 0.48;

  const spherical = new THREE.Spherical();
  const offset = new THREE.Vector3();
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let theta = 0.4, phi = 1.1, radius = 420;

  const update = () => {
    spherical.theta = theta;
    spherical.phi = Math.max(0.1, Math.min(this.maxPolarAngle, phi));
    spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, radius));
    offset.setFromSpherical(spherical);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  };

  domElement.addEventListener('pointerdown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
  window.addEventListener('pointerup', () => isDragging = false);
  window.addEventListener('pointermove', e => {
    if (!isDragging) return;
    theta -= (e.clientX - prevX) * 0.005;
    phi -= (e.clientY - prevY) * 0.005;
    prevX = e.clientX; prevY = e.clientY;
    update();
  });
  domElement.addEventListener('wheel', e => {
    radius *= (1 + e.deltaY * 0.001);
    update();
    e.preventDefault();
  }, { passive: false });

  this.update = update;
  update();
}
</script>
<script>
// ── Scene setup ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a8c9);
scene.fog = new THREE.FogExp2(0xb0c4d8, 0.0018);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(80, 140, 420);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new SimpleControls(camera, renderer.domElement);
controls.target.set(0, 50, 0);

// ── Lights ───────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x9bb0c8, 0.55));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.1);
sun.position.set(180, 220, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 800;
sun.shadow.camera.left = sun.shadow.camera.bottom = -400;
sun.shadow.camera.right = sun.shadow.camera.top = 400;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8eb4d4, 0.35);
fill.position.set(-120, 80, -100);
scene.add(fill);

// ── Materials ─────────────────────────────────────────────────────────────
const orange = 0xc0362c; // International Orange
const towerMat = new THREE.MeshPhongMaterial({ color: orange, shininess: 30 });
const cableMat = new THREE.MeshPhongMaterial({ color: 0x2a2a2a, shininess: 40 });
const deckMat  = new THREE.MeshPhongMaterial({ color: 0x4a4a4a, shininess: 15 });
const roadMat  = new THREE.MeshPhongMaterial({ color: 0x333333 });
const stripeMat = new THREE.MeshBasicMaterial({ color: 0xdddddd });

// ── Towers ────────────────────────────────────────────────────────────────
function createTower(xPos) {
  const g = new THREE.Group();
  const pillarGeo = new THREE.BoxGeometry(14, 210, 14);
  const left = new THREE.Mesh(pillarGeo, towerMat);
  left.position.set(-18, 105, 0);
  left.castShadow = left.receiveShadow = true;
  const right = new THREE.Mesh(pillarGeo, towerMat);
  right.position.set(18, 105, 0);
  right.castShadow = right.receiveShadow = true;
  g.add(left, right);

  // Horizontal crossbeams (Art Deco style)
  const beamGeo = new THREE.BoxGeometry(52, 6, 10);
  [40, 90, 140, 185].forEach(y => {
    const beam = new THREE.Mesh(beamGeo, towerMat);
    beam.position.y = y;
    beam.castShadow = true;
    g.add(beam);
  });

  // Diagonal X-bracing
  const diagGeo = new THREE.BoxGeometry(48, 3, 4);
  [[60, 0.7], [115, -0.55], [160, 0.45]].forEach(([y, rot]) => {
    const d = new THREE.Mesh(diagGeo, towerMat);
    d.position.y = y;
    d.rotation.z = rot;
    g.add(d);
  });

  // Top decorative crown
  const crown = new THREE.Mesh(new THREE.BoxGeometry(56, 8, 16), towerMat);
  crown.position.y = 208;
  g.add(crown);

  g.position.x = xPos;
  return g;
}

const tower1 = createTower(-220);
const tower2 = createTower(220);
scene.add(tower1, tower2);

// ── Main cables (parabolic catenary approximation) ───────────────────
function makeCable(start, end, sag, radius = 1.4, segments = 64) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = start.x + (end.x - start.x) * t;
    const z = start.z + (end.z - start.z) * t;
    const y = start.y + (end.y - start.y) * t - 4 * sag * t * (1 - t);
    pts.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, segments, radius, 6, false);
  const mesh = new THREE.Mesh(geo, cableMat);
  mesh.castShadow = true;
  return mesh;
}

const zSide = 22;
const leftAnch  = new THREE.Vector3(-480, 18, 0);
const rightAnch = new THREE.Vector3( 480, 18, 0);
const t1Top     = new THREE.Vector3(-220, 198, 0);
const t2Top     = new THREE.Vector3( 220, 198, 0);

// North & South main cables (two sides)
[-zSide, zSide].forEach(z => {
  const a = v => new THREE.Vector3(v.x, v.y, z);
  scene.add(makeCable(a(leftAnch),  a(t1Top), 28));
  scene.add(makeCable(a(t1Top),     a(t2Top), 55));
  scene.add(makeCable(a(t2Top),     a(rightAnch), 28));
});

// ── Suspender cables (vertical hangers) ──────────────────────────────
function cableHeightAt(x, z) {
  // Approximate main-span parabola between towers
  if (x >= -220 && x <= 220) {
    const t = (x + 220) / 440;
    return 198 - 4 * 55 * t * (1 - t);
  }
  // Side spans simplified
  if (x < -220) {
    const t = (x + 480) / 260;
    return 18 + (198 - 18) * t - 4 * 28 * t * (1 - t);
  }
  const t = (x - 220) / 260;
  return 198 - (198 - 18) * t - 4 * 28 * t * (1 - t);
}

const hangerMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
for (let x = -430; x <= 430; x += 12) {
  if (Math.abs(x) > 200 && Math.abs(x) < 240) continue; // skip near towers
  [-zSide, zSide].forEach(z => {
    const yTop = cableHeightAt(x, z);
    const length = yTop - 32;
    if (length < 5) return;
    const h = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, length, 4), hangerMat);
    h.position.set(x, 32 + length / 2, z);
    scene.add(h);
  });
}

// ── Deck & roadway ───────────────────────────────────────────────────
const deck = new THREE.Mesh(new THREE.BoxGeometry(960, 6, 48), deckMat);
deck.position.y = 29;
deck.receiveShadow = true;
deck.castShadow = true;
scene.add(deck);

// Road surface
const road = new THREE.Mesh(new THREE.BoxGeometry(940, 0.4, 36), roadMat);
road.position.y = 32.2;
scene.add(road);

// Lane markings
for (let i = -460; i < 460; i += 18) {
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 0.6), stripeMat);
  stripe.position.set(i, 32.5, 0);
  scene.add(stripe);
}

// Side barriers / railings
[-20, 20].forEach(z => {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(940, 2, 1.2), towerMat);
  rail.position.set(0, 34, z);
  scene.add(rail);
});

// ── Water ───────────────────────────────────────────────────────────────────
const waterGeo = new THREE.PlaneGeometry(2400, 1800, 120, 80);
const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColorDeep: { value: new THREE.Color(0x0a4a6e) },
    uColorShallow: { value: new THREE.Color(0x1a7a9e) }
  },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vWave;
    void main() {
      vUv = uv;
      vec3 pos = position;
      float wave = sin(pos.x * 0.04 + uTime * 0.8) * 1.8
                 + cos(pos.y * 0.035 + uTime * 0.6) * 1.4
                 + sin((pos.x + pos.y) * 0.02 + uTime * 1.1) * 0.9;
      pos.z += wave;
      vWave = wave;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColorDeep;
    uniform vec3 uColorShallow;
    varying vec2 vUv;
    varying float vWave;
    void main() {
      float foam = smoothstep(1.2, 2.2, vWave);
      vec3 col = mix(uColorDeep, uColorShallow, 0.5 + vWave * 0.15);
      col = mix(col, vec3(0.85, 0.92, 0.95), foam * 0.35);
      gl_FragColor = vec4(col, 0.82);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = -2;
water.receiveShadow = true;
scene.add(water);

// ── Rolling fog volumes ───────────────────────────────────────────
const fogVolumes = [];
const fogMat = new THREE.MeshBasicMaterial({
  color: 0xd0dce8,
  transparent: true,
  opacity: 0.18,
  depthWrite: false
});
for (let i = 0; i < 6; i++) {
  const fogBox = new THREE.Mesh(new THREE.BoxGeometry(280, 40, 180), fogMat);
  fogBox.position.set(
    (Math.random() - 0.5) * 800,
    40 + Math.random() * 60,
    (Math.random() - 0.5) * 200
  );
  fogBox.userData.speed = 0.15 + Math.random() * 0.25;
  fogBox.userData.phase = Math.random() * Math.PI * 2;
  scene.add(fogBox);
  fogVolumes.push(fogBox);
}

// ── Traffic ───────────────────────────────────────────────────────────────────
const cars = [];
function makeCar(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(7.5, 2.2, 3.4),
    new THREE.MeshPhongMaterial({ color, shininess: 60 })
  );
  body.position.y = 1.1;
  body.castShadow = true;
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(3.8, 1.6, 3.0),
    new THREE.MeshPhongMaterial({ color: 0x222222, shininess: 80 })
  );
  cabin.position.set(-0.4, 2.6, 0);
  g.add(body, cabin);
  return g;
}

const carColors = [0xcc2222, 0x2244cc, 0xeeeeee, 0x222222, 0xddaa22, 0x22aa55, 0x888888];
for (let i = 0; i < 28; i++) {
  const car = makeCar(carColors[Math.floor(Math.random() * carColors.length)]);
  const lane = Math.random() > 0.5 ? 8 : -8;
  const dir = lane > 0 ? 1 : -1;
  car.position.set(-420 + Math.random() * 840, 33.6, lane);
  car.rotation.y = dir > 0 ? 0 : Math.PI;
  car.userData.speed = (0.8 + Math.random() * 1.4) * dir;
  scene.add(car);
  cars.push(car);
}

// ── Distant land masses (simple) ───────────────────────────────────
const landMat = new THREE.MeshPhongMaterial({ color: 0x5a7a4a });
const northLand = new THREE.Mesh(new THREE.BoxGeometry(600, 30, 400), landMat);
northLand.position.set(0, 10, -500);
scene.add(northLand);
const southLand = new THREE.Mesh(new THREE.BoxGeometry(600, 25, 350), landMat);
southLand.position.set(0, 8, 520);
scene.add(southLand);

// ── Animation loop ──────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Water waves
  waterMat.uniforms.uTime.value = t;

  // Rolling fog
  scene.fog.density = 0.0014 + Math.sin(t * 0.35) * 0.0006;
  fogVolumes.forEach((f, i) => {
    f.position.x += f.userData.speed * 0.4;
    if (f.position.x > 550) f.position.x = -550;
    f.position.y = 35 + Math.sin(t * 0.4 + f.userData.phase) * 18;
    f.material.opacity = 0.12 + Math.sin(t * 0.6 + i) * 0.06;
  });

  // Traffic
  cars.forEach(car => {
    car.position.x += car.userData.speed;
    if (car.position.x > 450) car.position.x = -450;
    if (car.position.x < -450) car.position.x = 450;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
