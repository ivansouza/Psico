<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilusão de Círculos de Kitaoka (17x17 - Círculos Tangentes)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type=range] { accent-color: #eab308; }
    .checkerboard-bg {
      background-color: #0f172a;
      background-image: 
        linear-gradient(45deg, #1e293b 25%, transparent 25%),
        linear-gradient(-45deg, #1e293b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1e293b 75%),
        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans m-0 p-0">

  <!-- Engrenagem -->
  <div id="gearBtn" class="fixed top-3 left-3 z-50 w-9 h-9 bg-slate-900/70 backdrop-blur border border-slate-600/60 rounded-lg flex items-center justify-center cursor-pointer hover:bg-slate-800/80 transition shadow-lg text-lg select-none" style="font-size:20px;line-height:1">⚙️</div>

  <!-- Modal de Parâmetros (escondido por padrão) -->
  <aside id="controlPanel" class="fixed top-3 left-14 z-40 w-72 bg-slate-900/80 backdrop-blur-md border border-slate-700/60 p-3 flex flex-col gap-2 overflow-y-auto max-h-[calc(100vh-1.5rem)] shadow-2xl rounded-xl text-xs hidden" style="scrollbar-width:thin">

    <div class="flex items-center justify-between mb-1">
      <h1 class="text-sm font-bold text-amber-400">🌀 Kitaoka</h1>
      <button id="closePanel" class="text-slate-400 hover:text-white text-sm px-1">✕</button>
    </div>

    <!-- Predefinições -->
    <div class="flex gap-1">
      <button id="presetOriginal" class="flex-1 py-1.5 text-xs font-medium bg-amber-600/30 border border-amber-500/50 hover:bg-amber-600/50 rounded-lg transition text-amber-200">📷 Padrão</button>
      <button id="presetBW" class="flex-1 py-1.5 text-xs font-medium bg-slate-800 border border-slate-700 hover:bg-slate-700 rounded-lg transition text-slate-300">⬛ P&B</button>
    </div>

    <!-- Anéis -->
    <div class="border-t border-slate-700/60 pt-2">
      <div class="text-xs font-semibold text-slate-300 mb-1">Anéis</div>
      <div class="flex gap-2">
        <div class="flex-1"><div class="flex justify-between"><span>Escala</span><strong id="valOuterScale" class="text-amber-400">100%</strong></div><input type="range" id="inputOuterScale" min="70" max="100" step="1" value="100" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Qtd</span><strong id="valRings" class="text-amber-400">3</strong></div><input type="range" id="inputRings" min="1" max="6" value="3" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Esp</span><strong id="valRingWidth" class="text-amber-400">2</strong></div><input type="range" id="inputRingWidth" min="1" max="6" value="2" class="w-full"></div>
      </div>
    </div>

    <!-- Losangos -->
    <div class="border-t border-slate-700/60 pt-2">
      <div class="text-xs font-semibold text-slate-300 mb-1">Losangos</div>
      <select id="selectPatternMode" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500 mb-1">
        <option value="diagSine" selected>🌊 Senoide Diagonal</option>
        <option value="crossSine">🌀 Senoide Cruzada</option>
        <option value="concentric">⭕ Anéis Concêntricos</option>
        <option value="checkerboard">🏁 Xadrez</option>
      </select>
      <div id="sineControlsContainer">
        <div class="flex gap-2">
          <div class="flex-1"><div class="flex justify-between"><span>Ciclos</span><strong id="valSineCycles" class="text-amber-400">2.0</strong></div><input type="range" id="inputSineCycles" min="0.5" max="6.0" step="0.1" value="2.0" class="w-full"></div>
          <div class="flex-1"><div class="flex justify-between"><span>Ângulo</span><strong id="valSineAngle" class="text-amber-400">45°</strong></div><input type="range" id="inputSineAngle" min="0" max="180" step="5" value="45" class="w-full"></div>
        </div>
        <div class="flex gap-2">
          <div class="flex-1"><div class="flex justify-between"><span>Fase</span><strong id="valSinePhase" class="text-amber-400">0.00</strong></div><input type="range" id="inputSinePhase" min="0.0" max="6.28" step="0.05" value="0.0" class="w-full"></div>
          <div class="flex-1 flex items-end pb-1"><button id="btnAnimate" class="w-full py-1.5 bg-slate-800 border border-amber-500/40 hover:bg-amber-500/20 text-amber-300 rounded-lg text-xs transition">▶️ Animar</button></div>
        </div>
      </div>
      <div class="flex gap-2 mt-1">
        <div class="flex-1"><div class="flex justify-between"><span>Comp</span><strong id="valDiamondLength" class="text-amber-400">12</strong></div><input type="range" id="inputDiamondLength" min="4" max="24" value="12" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Larg</span><strong id="valDiamondWidth" class="text-amber-400">8</strong></div><input type="range" id="inputDiamondWidth" min="2" max="18" value="8" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Dist</span><strong id="valDiamondOffset" class="text-amber-400">7</strong></div><input type="range" id="inputDiamondOffset" min="1" max="18" value="7" class="w-full"></div>
      </div>
      <div class="flex gap-2 mt-1">
        <label class="flex items-center gap-1 text-xs text-slate-300"><input type="checkbox" id="checkShowAccents" checked class="w-3 h-3"> Mostrar</label>
        <label class="flex items-center gap-1 text-xs text-slate-300"><input type="checkbox" id="checkInvertStars" class="w-3 h-3"> Inverter</label>
      </div>
    </div>

    <!-- Grelha -->
    <div class="border-t border-slate-700/60 pt-2">
      <div class="text-xs font-semibold text-slate-300 mb-1">Grelha</div>
      <div class="flex gap-2">
        <div class="flex-1"><div class="flex justify-between"><span>N x N</span><strong id="valGridSize" class="text-amber-400">17x17</strong></div><input type="range" id="inputGridSize" min="10" max="20" value="17" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Célula</span><strong id="valTileSize" class="text-amber-400">55</strong></div><input type="range" id="inputTileSize" min="30" max="120" value="55" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Corte</span><strong id="valChamfer" class="text-amber-400">10</strong></div><input type="range" id="inputChamfer" min="2" max="25" value="10" class="w-full"></div>
      </div>
      <label class="flex items-center gap-1 text-xs text-slate-300 mt-1"><input type="checkbox" id="checkCustomGrid" class="w-3 h-3"> Assimétrico</label>
      <div id="customGridContainer" class="hidden flex gap-2 mt-1">
        <div class="flex-1"><div class="flex justify-between"><span>Col</span><strong id="valCols" class="text-amber-400">17</strong></div><input type="range" id="inputCols" min="5" max="25" value="17" class="w-full"></div>
        <div class="flex-1"><div class="flex justify-between"><span>Lin</span><strong id="valRows" class="text-amber-400">17</strong></div><input type="range" id="inputRows" min="5" max="25" value="17" class="w-full"></div>
      </div>
    </div>

    <!-- Cores -->
    <div class="border-t border-slate-700/60 pt-2">
      <div class="text-xs font-semibold text-slate-300 mb-1">Cores</div>
      <div class="grid grid-cols-3 gap-1 text-xs">
        <div><label class="text-slate-400">Claro</label><input type="color" id="colorLightTile" value="#d0a153" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
        <div><label class="text-slate-400">Escuro</label><input type="color" id="colorDarkTile" value="#70421b" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
        <div><label class="text-slate-400">Fundo</label><input type="color" id="colorBg" value="#1a0c02" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
        <div><label class="text-slate-400">Anel C</label><input type="color" id="colorLightRing" value="#ffffff" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
        <div><label class="text-slate-400">Anel E</label><input type="color" id="colorDarkRing" value="#1a0c02" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
        <div><label class="text-slate-400">Lima</label><input type="color" id="colorAccentLime" value="#96f300" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
        <div><label class="text-slate-400">Escuro</label><input type="color" id="colorAccentDark" value="#008435" class="w-full h-6 rounded cursor-pointer bg-transparent border-0 p-0"></div>
      </div>
      <div class="flex gap-2 mt-1">
        <label class="flex items-center gap-1 text-xs text-slate-300"><input type="checkbox" id="checkTransparentBg" checked class="w-3 h-3"> Transparente</label>
        <label class="flex items-center gap-1 text-xs text-slate-300"><input type="checkbox" id="checkShowGrid" class="w-3 h-3"> Guias</label>
      </div>
    </div>

    <button id="btnDownload" class="w-full py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shadow-lg mt-1">💾 Download PNG</button>
  </aside>

  <!-- Canvas centralizado -->
  <main class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 shadow-2xl">
      <div class="checkerboard-bg p-2 rounded-lg border border-slate-700/50 overflow-auto">
        <canvas id="illusionCanvas" class="rounded max-w-full h-auto cursor-pointer block"></canvas>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('illusionCanvas');
    const ctx = canvas.getContext('2d');

    const inputGridSize = document.getElementById('inputGridSize');
    const checkCustomGrid = document.getElementById('checkCustomGrid');
    const customGridContainer = document.getElementById('customGridContainer');
    const inputCols = document.getElementById('inputCols');
    const inputRows = document.getElementById('inputRows');
    const inputOuterScale = document.getElementById('inputOuterScale');
    const inputRings = document.getElementById('inputRings');
    const inputRingWidth = document.getElementById('inputRingWidth');
    const selectPatternMode = document.getElementById('selectPatternMode');
    const sineControlsContainer = document.getElementById('sineControlsContainer');
    const inputSineCycles = document.getElementById('inputSineCycles');
    const inputSineAngle = document.getElementById('inputSineAngle');
    const inputSinePhase = document.getElementById('inputSinePhase');
    const btnAnimate = document.getElementById('btnAnimate');
    const inputTileSize = document.getElementById('inputTileSize');
    const inputChamfer = document.getElementById('inputChamfer');
    const inputDiamondLength = document.getElementById('inputDiamondLength');
    const inputDiamondWidth = document.getElementById('inputDiamondWidth');
    const inputDiamondOffset = document.getElementById('inputDiamondOffset');
    const checkShowAccents = document.getElementById('checkShowAccents');
    const checkInvertStars = document.getElementById('checkInvertStars');
    const checkShowGrid = document.getElementById('checkShowGrid');
    const checkTransparentBg = document.getElementById('checkTransparentBg');
    const colorLightTile = document.getElementById('colorLightTile');
    const colorDarkTile = document.getElementById('colorDarkTile');
    const colorLightRing = document.getElementById('colorLightRing');
    const colorDarkRing = document.getElementById('colorDarkRing');
    const colorAccentLime = document.getElementById('colorAccentLime');
    const colorAccentDark = document.getElementById('colorAccentDark');
    const colorBg = document.getElementById('colorBg');
    const valGridSize = document.getElementById('valGridSize');
    const valCols = document.getElementById('valCols');
    const valRows = document.getElementById('valRows');
    const valOuterScale = document.getElementById('valOuterScale');
    const valRings = document.getElementById('valRings');
    const valRingWidth = document.getElementById('valRingWidth');
    const valTileSize = document.getElementById('valTileSize');
    const valChamfer = document.getElementById('valChamfer');
    const valDiamondLength = document.getElementById('valDiamondLength');
    const valDiamondWidth = document.getElementById('valDiamondWidth');
    const valDiamondOffset = document.getElementById('valDiamondOffset');
    const valSineCycles = document.getElementById('valSineCycles');
    const valSineAngle = document.getElementById('valSineAngle');
    const valSinePhase = document.getElementById('valSinePhase');
    const btnDownload = document.getElementById('btnDownload');
    const presetOriginal = document.getElementById('presetOriginal');
    const presetBW = document.getElementById('presetBW');
    const gearBtn = document.getElementById('gearBtn');
    const controlPanel = document.getElementById('controlPanel');
    const closePanel = document.getElementById('closePanel');

    let isAnimating = false;
    let animFrameId = null;

    function renderPattern() {
      const gridSize = parseInt(inputGridSize.value);
      const isCustom = checkCustomGrid.checked;
      const cols = isCustom ? parseInt(inputCols.value) : gridSize;
      const rows = isCustom ? parseInt(inputRows.value) : gridSize;
      const tileSize = parseInt(inputTileSize.value);
      const chamfer = parseInt(inputChamfer.value);
      const outerScaleFactor = parseInt(inputOuterScale.value) / 100;
      const numRings = parseInt(inputRings.value);
      const ringWidth = parseInt(inputRingWidth.value);
      const diamondLength = parseInt(inputDiamondLength.value);
      const diamondWidth = parseInt(inputDiamondWidth.value);
      const diamondOffset = parseInt(inputDiamondOffset.value);
      const patternMode = selectPatternMode.value;
      const sineCycles = parseFloat(inputSineCycles.value);
      const sineAngle = parseFloat(inputSineAngle.value);
      const sinePhase = parseFloat(inputSinePhase.value);
      const showAccents = checkShowAccents.checked;
      const invertStars = checkInvertStars.checked;
      const showGrid = checkShowGrid.checked;
      const transparentBg = checkTransparentBg.checked;

      if (isCustom) customGridContainer.classList.remove('hidden');
      else customGridContainer.classList.add('hidden');

      if (patternMode === 'diagSine' || patternMode === 'crossSine' || patternMode === 'concentric') sineControlsContainer.classList.remove('hidden');
      else sineControlsContainer.classList.add('hidden');

      valGridSize.textContent = `${gridSize}x${gridSize}`;
      valCols.textContent = cols;
      valRows.textContent = rows;
      valOuterScale.textContent = `${inputOuterScale.value}%`;
      valTileSize.textContent = tileSize;
      valChamfer.textContent = chamfer;
      valRings.textContent = numRings;
      valRingWidth.textContent = ringWidth;
      valDiamondLength.textContent = diamondLength;
      valDiamondWidth.textContent = diamondWidth;
      valDiamondOffset.textContent = diamondOffset;
      valSineCycles.textContent = sineCycles.toFixed(1);
      valSineAngle.textContent = `${sineAngle}°`;
      valSinePhase.textContent = sinePhase.toFixed(2);

      canvas.width = cols * tileSize;
      canvas.height = rows * tileSize;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!transparentBg) { ctx.fillStyle = colorBg.value; ctx.fillRect(0, 0, canvas.width, canvas.height); }

      const maxRadius = (tileSize / 2) * outerScaleFactor;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * tileSize, y = r * tileSize;
          const isLightTile = (r + c) % 2 === 0;
          const tileColor = isLightTile ? colorLightTile.value : colorDarkTile.value;
          const ringColor = isLightTile ? colorLightRing.value : colorDarkRing.value;

          ctx.beginPath();
          ctx.moveTo(x + chamfer, y); ctx.lineTo(x + tileSize - chamfer, y);
          ctx.lineTo(x + tileSize, y + chamfer); ctx.lineTo(x + tileSize, y + tileSize - chamfer);
          ctx.lineTo(x + tileSize - chamfer, y + tileSize); ctx.lineTo(x + chamfer, y + tileSize);
          ctx.lineTo(x, y + tileSize - chamfer); ctx.lineTo(x, y + chamfer);
          ctx.closePath();
          ctx.fillStyle = tileColor; ctx.fill();

          const cx = x + tileSize / 2, cy = y + tileSize / 2;
          ctx.strokeStyle = ringColor; ctx.lineWidth = ringWidth;
          for (let k = 1; k <= numRings; k++) {
            ctx.beginPath(); ctx.arc(cx, cy, k * (maxRadius / numRings), 0, Math.PI * 2); ctx.stroke();
          }
          ctx.beginPath(); ctx.arc(cx, cy, ringWidth * 1.2, 0, Math.PI * 2);
          ctx.fillStyle = ringColor; ctx.fill();
        }
      }

      if (showAccents && diamondLength > 0) {
        const rad = (sineAngle * Math.PI) / 180;
        const cosAngle = Math.cos(rad), sinAngle = Math.sin(rad);
        const p00 = 0, p10 = cols * cosAngle, p01 = rows * sinAngle, p11 = cols * cosAngle + rows * sinAngle;
        const minP = Math.min(p00, p10, p01, p11), maxP = Math.max(p00, p10, p01, p11), rangeP = (maxP - minP) || 1;

        for (let rInt = 0; rInt <= rows; rInt++) {
          for (let cInt = 0; cInt <= cols; cInt++) {
            const ix = cInt * tileSize, iy = rInt * tileSize;
            let isLimeStar = false;
            if (patternMode === 'diagSine') {
              const proj = cInt * cosAngle + rInt * sinAngle;
              isLimeStar = Math.sin(((proj - minP) / rangeP) * Math.PI * 2 * sineCycles + sinePhase) >= 0;
            } else if (patternMode === 'crossSine') {
              const v1 = Math.sin((cInt / cols) * Math.PI * 2 * sineCycles + sinePhase);
              const v2 = Math.sin((rInt / rows) * Math.PI * 2 * sineCycles + sinePhase);
              isLimeStar = (v1 + v2) >= 0;
            } else if (patternMode === 'concentric') {
              const dx = (cInt - cols / 2) / (cols / 2), dy = (rInt - rows / 2) / (rows / 2);
              isLimeStar = Math.sin(Math.sqrt(dx * dx + dy * dy) * Math.PI * sineCycles + sinePhase) >= 0;
            } else { isLimeStar = (rInt + cInt) % 2 === 0; }
            if (invertStars) isLimeStar = !isLimeStar;
            drawMonolithicStar(ctx, ix, iy, diamondLength, diamondWidth, diamondOffset, isLimeStar ? colorAccentLime.value : colorAccentDark.value);
          }
        }
      }

      if (showGrid) {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)'; ctx.lineWidth = 2;
        for (let c = 0; c <= cols; c++) { ctx.beginPath(); ctx.moveTo(c * tileSize, 0); ctx.lineTo(c * tileSize, canvas.height); ctx.stroke(); }
        for (let r = 0; r <= rows; r++) { ctx.beginPath(); ctx.moveTo(0, r * tileSize); ctx.lineTo(canvas.width, r * tileSize); ctx.stroke(); }
      }
    }

    function drawMonolithicStar(ctx, ix, iy, length, width, offset, starColor) {
      [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2].forEach(angle => {
        drawSingleDiamond(ctx, ix + offset * Math.cos(angle), iy + offset * Math.sin(angle), length, width, angle, starColor);
      });
    }

    function drawSingleDiamond(ctx, cx, cy, length, width, angleRad, color) {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(angleRad);
      const halfLen = length / 2, halfWidth = width / 2;
      ctx.beginPath(); ctx.moveTo(-halfLen, 0); ctx.lineTo(0, -halfWidth); ctx.lineTo(halfLen, 0); ctx.lineTo(0, halfWidth); ctx.closePath();
      ctx.fillStyle = color; ctx.fill(); ctx.restore();
    }

    function toggleAnimation() {
      if (isAnimating) {
        isAnimating = false; if (animFrameId) cancelAnimationFrame(animFrameId);
        btnAnimate.innerHTML = '▶️ Animar';
      } else {
        isAnimating = true; btnAnimate.innerHTML = '⏸️ Pausar';
        function animateLoop() {
          if (!isAnimating) return;
          let p = parseFloat(inputSinePhase.value); p = (p + 0.04) % (Math.PI * 2);
          inputSinePhase.value = p.toFixed(2); renderPattern();
          animFrameId = requestAnimationFrame(animateLoop);
        }
        animateLoop();
      }
    }

    presetOriginal.addEventListener('click', () => {
      colorLightTile.value = '#d0a153'; colorDarkTile.value = '#70421b';
      colorLightRing.value = '#ffffff'; colorDarkRing.value = '#1a0c02';
      colorAccentLime.value = '#96f300'; colorAccentDark.value = '#008435';
      inputGridSize.value = 17; checkCustomGrid.checked = false;
      inputCols.value = 17; inputRows.value = 17;
      inputOuterScale.value = 100; inputRings.value = 3; inputRingWidth.value = 2;
      selectPatternMode.value = 'diagSine'; inputSineCycles.value = 2.0; inputSineAngle.value = 45; inputSinePhase.value = 0.0;
      inputTileSize.value = 55; inputChamfer.value = 10;
      inputDiamondLength.value = 12; inputDiamondWidth.value = 8; inputDiamondOffset.value = 7;
      checkTransparentBg.checked = true; checkShowAccents.checked = true; checkInvertStars.checked = false; checkShowGrid.checked = false;
      renderPattern();
    });

    presetBW.addEventListener('click', () => {
      colorDarkTile.value = '#000000'; colorLightTile.value = '#ffffff';
      colorDarkRing.value = '#ffffff'; colorLightRing.value = '#000000';
      colorAccentLime.value = '#00ff00'; colorAccentDark.value = '#006600';
      renderPattern();
    });

    const allInputs = [
      inputGridSize, checkCustomGrid, inputCols, inputRows, selectPatternMode,
      inputOuterScale, inputRings, inputRingWidth,
      inputSineCycles, inputSineAngle, inputSinePhase,
      inputTileSize, inputChamfer,
      inputDiamondLength, inputDiamondWidth, inputDiamondOffset, checkShowAccents,
      checkInvertStars, checkShowGrid, checkTransparentBg,
      colorLightTile, colorDarkTile, colorLightRing, colorDarkRing, colorAccentLime, colorAccentDark, colorBg
    ];
    allInputs.forEach(input => { input.addEventListener('input', renderPattern); input.addEventListener('change', renderPattern); });

    btnAnimate.addEventListener('click', toggleAnimation);

    btnDownload.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'ilusao-kitaoka-circulos-tangentes-17x17.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Gear toggle
    gearBtn.addEventListener('click', () => { controlPanel.classList.toggle('hidden'); });
    closePanel.addEventListener('click', () => { controlPanel.classList.add('hidden'); });

    renderPattern();
  </script>
</body>
</html>
