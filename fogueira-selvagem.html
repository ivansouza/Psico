<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fogueira selvagem · WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_zoom;
out vec4 fragColor;

#define t u_time

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float a = hash(i), b = hash(i + vec2(1,0)), c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.02 + vec2(17.1, 9.7); a *= 0.5; }
  return v;
}

// === Mesmo raymarch do 3d-fire.html ===
vec3 fire3d(vec2 virtualFC, vec2 virtualRes, float tt) {
  vec4 o = vec4(0.0);
  float z = 0.0, d = 0.0, j = 0.0;
  vec4 FC = vec4(virtualFC, 0.0, 1.0);
  vec3 r = vec3(virtualRes, 1.0);
  for (float i = 0.0; i < 50.0; i++) {
    vec3 p = z * normalize(FC.rgb * 2.0 - r.xyy);
    p.z += 5.0 + cos(tt);
    p.xz *= mat2(cos(tt + p.y * 0.5 + vec4(0, 33, 11, 0))) / max(p.y * 0.1 + 1.0, 0.1);
    for (j = 2.0; j < 15.0; j /= 0.6) {
      p += cos((p.yzx - vec3(tt, 0.0, 0.0) / 0.1) * j + tt) / j;
    }
    z += d = 0.01 + abs(length(p.xz) + p.y * 0.3 - 0.5) / 7.0;
    o += (sin(z / 3.0 + vec4(7, 2, 3, 0)) + 1.1) / d;
  }
  return tanh(o / 1000.0).rgb;
}

float stickMask(vec2 p) {
  float m = 0.0;
  for (int i = 0; i < 9; i++) {
    float fi = float(i);
    float ang = -1.05 + fi * 0.26 + 0.06 * sin(fi * 2.3);
    vec2 dir = normalize(vec2(sin(ang), 0.35 + 0.25 * cos(fi)));
    vec2 o = vec2(0.0, -0.42);
    float len = 0.28 + 0.06 * sin(fi * 1.7);
    float proj = clamp(dot(p - o, dir), 0.0, len);
    float d = length(p - (o + dir * proj));
    float thick = mix(0.014, 0.005, proj / len);
    m = max(m, 1.0 - smoothstep(thick, thick + 0.006, d));
  }
  return m;
}

float spark(vec2 uv, float tt, float seed) {
  float h = hash(vec2(seed, seed * 1.7));
  float life = fract(tt * (0.11 + 0.28 * h) + h);
  float x = (hash(vec2(seed * 3.1, 2.2)) - 0.5) * 0.35 + 0.05 * sin(life * 14.0 + seed);
  float y = -0.35 + life * (0.7 + 0.5 * h);
  float s = exp(-length(uv - vec2(x, y)) * (110.0 + 90.0 * h));
  return s * smoothstep(0.0, 0.06, life) * smoothstep(1.0, 0.5, life);
}

void main() {
  vec2 res = u_resolution;
  vec2 fc = gl_FragCoord.xy;

  // Composição vertical tipo a foto: fogo no centro-baixo, alto no quadro
  vec2 uv = (fc - 0.5 * res) / res.y;
  uv /= max(u_zoom, 0.35);
  uv.x -= (u_mouse.x / res.x - 0.5) * 0.55;
  uv.y -= (u_mouse.y / res.y - 0.5) * 0.35;
  // sobe o fogo no frame (como a foto)
  uv.y += 0.05;

  // Fundo preto puro (foto)
  vec3 col = vec3(0.0);

  // Lua pequena, desfocada, canto superior esquerdo
  vec2 moonP = vec2(-0.38, 0.72);
  float md = length(uv - moonP);
  float moon = smoothstep(0.028, 0.012, md);
  moon += 0.45 * exp(-md * 55.0);
  moon += 0.12 * exp(-md * 18.0);
  col += moon * vec3(0.95, 0.95, 0.94);

  // Chão só na base (terra/areia iluminada)
  float ground = smoothstep(-0.28, -0.55, uv.y) * smoothstep(-0.72, -0.48, uv.y);
  ground *= exp(-abs(uv.x) * 2.8);
  vec2 gp = uv * vec2(8.0, 14.0);
  float grit = fbm(gp);
  vec3 groundCol = vec3(0.06, 0.035, 0.015) * (0.5 + 0.5 * grit);
  float baseGlow = exp(-length(uv - vec2(0.0, -0.42)) * 3.5);
  groundCol += vec3(0.45, 0.14, 0.02) * baseGlow * (0.35 + 0.2 * sin(t * 3.5));
  col += groundCol * ground * 0.85;

  // Brasas magenta/vermelho sob a madeira
  float emberR = length(uv - vec2(0.0, -0.40));
  float ember = exp(-emberR * 12.0) * (0.8 + 0.2 * sin(t * 5.0 + fbm(uv * 20.0) * 6.0));
  ember *= 0.6 + 0.5 * fbm(uv * 30.0 + t * 0.3);
  col += vec3(1.0, 0.08, 0.18) * ember * 0.9;
  col += vec3(0.7, 0.05, 0.0) * exp(-emberR * 6.0) * 0.35;

  // Gravetos / teepee de madeira
  float sticks = stickMask(uv);
  vec3 wood = vec3(0.035, 0.022, 0.012);
  wood += vec3(0.55, 0.12, 0.02) * ember * 0.7;
  wood += vec3(0.15, 0.05, 0.01) * baseGlow;
  col = mix(col, wood, sticks * 0.95);

  // --- Fogo 3d-fire, enquadrado como na foto (coluna alta) ---
  // Centro do volume um pouco acima da madeira
  vec2 fireOrigin = vec2(0.0, -0.18);
  float fireScale = 1.55; // preenche bem o quadro vertical
  vec2 virtRes = vec2(res.y, res.y);
  vec2 virtFC = (uv - fireOrigin) * res.y * fireScale + 0.5 * virtRes;
  // o volume do 3d-fire “senta” no meio do FB virtual; ajusta
  virtFC.y -= 0.02 * res.y;

  vec3 fire = fire3d(virtFC, virtRes, t);

  // Empurra paleta um pouco mais “foto”: laranja/amarelo quente
  fire = pow(max(fire, 0.0), vec3(0.92, 0.95, 1.05));
  fire *= vec3(1.15, 0.95, 0.75);

  float lum = max(max(fire.r, fire.g), fire.b);
  // Mantém fogo onde há energia; corta vazamento no céu preto
  float gate = smoothstep(0.015, 0.09, lum);
  // coluna: mais forte no eixo, some nas laterais distantes
  gate *= exp(-pow(abs(uv.x) * 1.6, 2.2));
  gate *= smoothstep(-0.65, -0.35, uv.y) * smoothstep(0.95, 0.15, uv.y);

  col += fire * gate;

  // Faíscas esparsas (como na foto)
  float sp = 0.0;
  for (float i = 0.0; i < 12.0; i++) sp += spark(uv, t, i + 1.0);
  col += vec3(1.0, 0.55, 0.12) * sp * 1.3;

  // Glow apertado perto da base (sem iluminar o void)
  col += vec3(0.35, 0.1, 0.02) * exp(-length(uv - vec2(0.0, -0.35)) * 4.0) * 0.15;

  col = tanh(col * 1.2);
  fragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
  document.body.textContent = 'WebGL2 não suportado neste navegador.';
  throw new Error('WebGL2');
}
function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, document.getElementById('vertex-shader').text));
gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, document.getElementById('fragment-shader').text));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(program, 'u_resolution');
const uTime = gl.getUniformLocation(program, 'u_time');
const uMouse = gl.getUniformLocation(program, 'u_mouse');
const uZoom = gl.getUniformLocation(program, 'u_zoom');

let mouse = { x: 0, y: 0 };
let zoom = 0.92; // enquadramento próximo da foto
let dragging = false, last = null;

function setMouse(e) {
  const rect = canvas.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : e;
  mouse.x = (s.clientX - rect.left) * (canvas.width / rect.width);
  mouse.y = (rect.bottom - s.clientY) * (canvas.height / rect.height);
}
canvas.addEventListener('pointerdown', e => {
  dragging = true; last = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId); setMouse(e);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) { setMouse(e); return; }
  if (last) {
    mouse.x += (e.clientX - last.x) * (canvas.width / canvas.clientWidth);
    mouse.y -= (e.clientY - last.y) * (canvas.height / canvas.clientHeight);
  }
  last = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', () => { dragging = false; last = null; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.93 : 1.07;
  zoom = Math.min(1.8, Math.max(0.45, zoom));
}, { passive: false });

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  if (!mouse.x && !mouse.y) {
    mouse.x = canvas.width * 0.5;
    mouse.y = canvas.height * 0.4;
  }
}
addEventListener('resize', resize);
resize();

function render(ms) {
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, ms * 0.001);
  gl.uniform2f(uMouse, mouse.x, mouse.y);
  gl.uniform1f(uZoom, zoom);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
