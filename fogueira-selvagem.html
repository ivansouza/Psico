<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fogueira selvagem · WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 2;
    font: 12px/1.4 system-ui, sans-serif; color: rgba(255,200,120,.5);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hint">arraste · scroll zoom</div>

<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_zoom;
out vec4 fragColor;

// Mesmos defines do 3d-fire.html (Twigl geekest)
#define t u_time

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float a = hash(i), b = hash(i + vec2(1,0)), c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.7); a *= 0.5; }
  return v;
}

float pineTree(vec2 p, vec2 pos, float scale) {
  vec2 q = (p - pos) / scale;
  float trunk = 1.0 - smoothstep(0.04, 0.07, abs(q.x + 0.01 * sin(q.y * 8.0)));
  trunk *= smoothstep(-0.05, 0.0, q.y) * smoothstep(0.55, 0.15, q.y);
  float crown = 0.0;
  for (float i = 0.0; i < 3.0; i++) {
    float y0 = 0.18 + i * 0.22;
    float h = 0.28 - i * 0.02;
    float w = 0.42 - i * 0.08;
    vec2 c = q - vec2(0.0, y0);
    float tri = max(1.0 - (c.y / h + abs(c.x) / w), 0.0);
    tri *= smoothstep(-0.02, 0.05, c.y) * smoothstep(h + 0.02, h - 0.15, c.y);
    tri *= 0.75 + 0.35 * fbm(q * 6.0 + i * 3.1);
    crown = max(crown, tri);
  }
  return max(trunk * 0.9, crown);
}

float rock(vec2 p, vec2 pos, float scale) {
  vec2 q = (p - pos) / scale;
  float d = length(q * vec2(1.0, 1.35)) + 0.15 * fbm(q * 3.0);
  return 1.0 - smoothstep(0.55, 0.85, d);
}

float tent(vec2 p, vec2 pos, float scale) {
  vec2 q = (p - pos) / scale;
  float roof = max(1.0 - (abs(q.x) * 1.6 + q.y * 1.1), 0.0);
  roof *= smoothstep(-0.05, 0.0, q.y) * smoothstep(0.95, 0.35, q.y);
  float pole = 1.0 - smoothstep(0.02, 0.045, abs(q.x));
  pole *= smoothstep(-0.02, 0.05, q.y) * smoothstep(0.9, 0.2, q.y);
  return max(roof * 0.85, pole * 0.5);
}

// === Código de fogo idêntico ao 3d-fire.html, com FC/r virtuais ===
vec3 fire3d(vec2 virtualFC, vec2 virtualRes, float time) {
  vec4 o = vec4(0.0);
  float z = 0.0, d = 0.0, j = 0.0;
  vec4 FC = vec4(virtualFC, 0.0, 1.0);
  vec3 r = vec3(virtualRes, 1.0);
  float tt = time;
  for (float i = 0.0; i < 50.0; i++) {
    vec3 p = z * normalize(FC.rgb * 2.0 - r.xyy);
    p.z += 5.0 + cos(tt);
    p.xz *= mat2(cos(tt + p.y * 0.5 + vec4(0, 33, 11, 0))) / max(p.y * 0.1 + 1.0, 0.1);
    for (j = 2.0; j < 15.0; j /= 0.6) {
      p += cos((p.yzx - vec3(tt, 0.0, 0.0) / 0.1) * j + tt) / j;
    }
    z += d = 0.01 + abs(length(p.xz) + p.y * 0.3 - 0.5) / 7.0;
    o += (sin(z / 3.0 + vec4(7, 2, 3, 0)) + 1.1) / d;
  }
  return tanh(o / 1000.0).rgb;
}

void main() {
  vec2 res = u_resolution;
  vec2 fc = gl_FragCoord.xy;

  // UV de cena — bem afastado
  vec2 uv = (fc - 0.5 * res) / res.y;
  uv /= max(u_zoom, 0.2);
  uv.x -= (u_mouse.x / res.x - 0.5) * 1.4;
  uv.y -= (u_mouse.y / res.y - 0.5) * 0.8;
  uv.y += 0.08;

  // —— cenário ——
  vec3 col = vec3(0.012, 0.016, 0.03);
  col = mix(col, vec3(0.03, 0.04, 0.07), smoothstep(-0.2, 0.6, uv.y));
  float st = step(0.9965, hash(floor(fc * 0.5)));
  col += st * vec3(0.65, 0.7, 0.8) * (0.3 + 0.7 * hash(fc.yx));

  vec2 moonP = vec2(-1.1, 0.75);
  float moonD = length(uv - moonP);
  col += (smoothstep(0.06, 0.04, moonD) + 0.3 * exp(-moonD * 10.0) + 0.1 * exp(-moonD * 3.5))
       * vec3(0.9, 0.9, 0.88);

  float groundY = -0.32;
  float groundMask = smoothstep(0.025, -0.02, uv.y - groundY);
  vec2 gp = vec2(uv.x / max(0.2 - uv.y, 0.1), (groundY - uv.y) * 3.5);
  float dirt = fbm(gp * 2.2);
  vec3 groundCol = mix(vec3(0.045, 0.035, 0.022), vec3(0.08, 0.06, 0.03), dirt);
  groundCol = mix(groundCol, vec3(0.05, 0.07, 0.025), fbm(gp * 6.5) * 0.3);

  vec2 fireWorld = vec2(0.0, groundY + 0.04);
  float distFire = length(uv - fireWorld);
  float light = exp(-distFire * 1.8) * (0.5 + 0.15 * sin(t * 4.0));
  light *= groundMask;
  groundCol += vec3(0.5, 0.2, 0.04) * light;
  groundCol += vec3(0.2, 0.06, 0.01) * exp(-distFire * 0.9) * groundMask * 0.3;
  col = mix(col, groundCol, groundMask);

  float forest = 0.0;
  forest = max(forest, pineTree(uv, vec2(-1.7, groundY), 1.15));
  forest = max(forest, pineTree(uv, vec2(-1.25, groundY), 0.85));
  forest = max(forest, pineTree(uv, vec2(-0.9, groundY), 1.25));
  forest = max(forest, pineTree(uv, vec2(0.95, groundY), 1.0));
  forest = max(forest, pineTree(uv, vec2(1.35, groundY), 1.3));
  forest = max(forest, pineTree(uv, vec2(1.75, groundY), 0.8));
  for (float i = -5.0; i <= 5.0; i++) {
    float x = i * 0.42 + 0.04 * sin(i * 2.1);
    if (abs(x) < 0.45) continue;
    forest = max(forest, pineTree(uv, vec2(x, groundY - 0.01), 0.5 + 0.15 * hash(vec2(i, 2.0))));
  }
  vec3 forestCol = vec3(0.01, 0.014, 0.018);
  forestCol += vec3(0.1, 0.04, 0.01) * exp(-abs(uv.x) * 1.1) * light * 0.7;
  col = mix(col, forestCol, clamp(forest, 0.0, 1.0) * 0.95);

  float rocks = 0.0;
  rocks = max(rocks, rock(uv, vec2(-0.28, groundY + 0.01), 0.11));
  rocks = max(rocks, rock(uv, vec2(0.26, groundY), 0.09));
  rocks = max(rocks, rock(uv, vec2(-0.14, groundY - 0.01), 0.07));
  rocks = max(rocks, rock(uv, vec2(0.16, groundY + 0.02), 0.075));
  col = mix(col, vec3(0.07, 0.06, 0.055) + vec3(0.3, 0.12, 0.03) * light, rocks * 0.9);

  float tn = tent(uv, vec2(-0.7, groundY), 0.48);
  vec3 tentCol = vec3(0.055, 0.045, 0.035) + vec3(0.18, 0.07, 0.02) * light * 0.5;
  col = mix(col, tentCol, tn * 0.88);

  // —— fogo: mesmo raymarch do 3d-fire, viewport pequeno e baixo ——
  // Escala alta = fogueira pequena no quadro (bem afastada)
  float fireScale = 3.8;
  vec2 virtRes = vec2(res.y, res.y);
  // centro do fogo no “framebuffer virtual” do 3d-fire
  vec2 virtFC = (uv - fireWorld) * res.y * fireScale + 0.5 * virtRes;
  // leve offset vertical: no 3d-fire o volume fica no meio; puxa um pouco
  virtFC.y -= res.y * 0.08;

  vec3 fire = fire3d(virtFC, virtRes, t);

  // mascara suave pra misturar no cenário (fora do volume → preto)
  float fireGate = smoothstep(0.02, 0.08, max(max(fire.r, fire.g), fire.b));
  fireGate *= exp(-pow(length((uv - fireWorld) * vec2(1.1, 0.85)) * 1.15, 2.0));

  col += fire * fireGate * 1.15;
  col += vec3(0.25, 0.09, 0.02) * exp(-distFire * 2.2) * 0.12;

  float vig = smoothstep(1.7, 0.45, length(uv * vec2(0.65, 0.85)));
  col *= vig;
  col = tanh(col * 1.05);
  fragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
  document.body.textContent = 'WebGL2 não suportado neste navegador.';
  throw new Error('WebGL2');
}
function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, document.getElementById('vertex-shader').text));
gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, document.getElementById('fragment-shader').text));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const positionLocation = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(positionLocation);
gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

const resLocation = gl.getUniformLocation(program, 'u_resolution');
const timeLocation = gl.getUniformLocation(program, 'u_time');
const mouseLocation = gl.getUniformLocation(program, 'u_mouse');
const zoomLocation = gl.getUniformLocation(program, 'u_zoom');

let mouse = { x: 0, y: 0 };
// bem mais afastado
let zoom = 0.32;
let dragging = false, last = null;

function setMouseFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  mouse.x = (src.clientX - rect.left) * (canvas.width / rect.width);
  mouse.y = (rect.bottom - src.clientY) * (canvas.height / rect.height);
}
canvas.addEventListener('pointerdown', (e) => {
  dragging = true; last = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId); setMouseFromEvent(e);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) { setMouseFromEvent(e); return; }
  if (last) {
    mouse.x += (e.clientX - last.x) * (canvas.width / canvas.clientWidth);
    mouse.y -= (e.clientY - last.y) * (canvas.height / canvas.clientHeight);
  }
  last = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', () => { dragging = false; last = null; });
canvas.addEventListener('pointercancel', () => { dragging = false; last = null; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.min(1.8, Math.max(0.18, zoom));
}, { passive: false });

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  if (mouse.x === 0 && mouse.y === 0) {
    mouse.x = canvas.width * 0.5;
    mouse.y = canvas.height * 0.48;
  }
}
window.addEventListener('resize', resize);
resize();

function render(time) {
  if (canvas.width !== Math.floor(window.innerWidth * Math.min(devicePixelRatio || 1, 2))) resize();
  gl.uniform2f(resLocation, canvas.width, canvas.height);
  gl.uniform1f(timeLocation, time * 0.001);
  gl.uniform2f(mouseLocation, mouse.x, mouse.y);
  gl.uniform1f(zoomLocation, zoom);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
