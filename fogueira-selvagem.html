<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fogueira selvagem · WebGL2</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hint {
    position: fixed; left: 12px; bottom: 12px; z-index: 2;
    font: 12px/1.4 system-ui, sans-serif; color: rgba(255,200,120,.5);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="hint">arraste · scroll zoom</div>

<script id="vertex-shader" type="x-shader/x-vertex">#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_zoom;
out vec4 fragColor;

#define T u_time

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  float a = hash(i), b = hash(i + vec2(1,0)), c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.7); a *= 0.5; }
  return v;
}

vec3 firePalette(float x) {
  x = clamp(x, 0.0, 1.0);
  vec3 c = vec3(0.0);
  c = mix(c, vec3(0.55, 0.04, 0.0), smoothstep(0.0, 0.14, x));
  c = mix(c, vec3(1.0, 0.2, 0.0), smoothstep(0.10, 0.32, x));
  c = mix(c, vec3(1.0, 0.6, 0.0), smoothstep(0.28, 0.55, x));
  c = mix(c, vec3(1.0, 0.94, 0.66), smoothstep(0.50, 0.78, x));
  c = mix(c, vec3(1.0), smoothstep(0.75, 1.0, x));
  return c;
}

float fireField(vec2 p, float t) {
  float w = 0.18 + 0.07 * (1.0 - p.y);
  vec2 q = p;
  q.x += 0.10 * sin(t * 1.7 + p.y * 6.0);
  q.x += 0.07 * (fbm(vec2(p.x * 3.0, p.y * 2.0 - t * 1.4)) - 0.5);
  q.y += 0.04 * fbm(vec2(p.x * 2.0 - t * 0.6, p.y * 3.0));
  float n = fbm(vec2(q.x * 4.5, q.y * 2.8 - t * 2.2));
  n = n * 0.65 + 0.35 * fbm(vec2(q.x * 9.0 + 3.1, q.y * 5.0 - t * 3.5));
  float shape = max(1.0 - abs(q.x) / max(w * (0.55 + 0.9 * n), 0.02), 0.0);
  shape *= smoothstep(1.05, 0.12, p.y);
  shape *= smoothstep(-0.06, 0.10, p.y);
  return pow(clamp(shape * (0.35 + 0.9 * n), 0.0, 1.5), 1.35);
}

float emberGlow(vec2 p, float t) {
  float r = length(p - vec2(0.0, -0.015));
  float pulse = 0.85 + 0.15 * sin(t * 3.0 + fbm(p * 8.0 + t) * 6.28);
  float g = exp(-r * 16.0) * pulse + 0.3 * exp(-r * 7.0);
  return g * (0.7 + 0.5 * fbm(p * 18.0 + vec2(t * 0.4, -t * 0.2)));
}

float stickMask(vec2 p) {
  float m = 0.0;
  for (int i = 0; i < 7; i++) {
    float fi = float(i);
    float ang = -0.9 + fi * 0.28 + 0.08 * sin(fi * 2.1);
    vec2 dir = vec2(sin(ang), cos(ang) * 0.55);
    vec2 o = vec2(0.0, -0.015);
    float proj = clamp(dot(p - o, dir), 0.0, 0.18 + 0.03 * sin(fi));
    float d = length(p - (o + dir * proj));
    float thick = mix(0.010, 0.005, proj / 0.22);
    m = max(m, 1.0 - smoothstep(thick, thick + 0.007, d));
  }
  return m;
}

float spark(vec2 uv, float t, float seed) {
  float h = hash(vec2(seed, seed * 1.7));
  float life = fract(t * (0.12 + 0.3 * h) + h);
  float x = (hash(vec2(seed * 3.1, 2.2)) - 0.5) * 0.45 + 0.06 * sin(life * 12.0 + seed);
  float y = life * (0.45 + 0.55 * h) - 0.02;
  float s = exp(-length(uv - vec2(x, y)) * (100.0 + 70.0 * h));
  return s * smoothstep(0.0, 0.08, life) * smoothstep(1.0, 0.55, life);
}

// Silhueta de pinheiro (tronco + copa triangular irregular)
float pineTree(vec2 p, vec2 pos, float scale) {
  vec2 q = (p - pos) / scale;
  float trunk = 1.0 - smoothstep(0.04, 0.07, abs(q.x + 0.01 * sin(q.y * 8.0)));
  trunk *= smoothstep(-0.05, 0.0, q.y) * smoothstep(0.55, 0.15, q.y);
  float crown = 0.0;
  for (float i = 0.0; i < 3.0; i++) {
    float y0 = 0.18 + i * 0.22;
    float h = 0.28 - i * 0.02;
    float w = 0.42 - i * 0.08;
    vec2 c = q - vec2(0.0, y0);
    float tri = max(1.0 - (c.y / h + abs(c.x) / w), 0.0);
    tri *= smoothstep(-0.02, 0.05, c.y) * smoothstep(h + 0.02, h - 0.15, c.y);
    float edge = fbm(q * 6.0 + i * 3.1);
    tri *= 0.75 + 0.35 * edge;
    crown = max(crown, tri);
  }
  return max(trunk * 0.9, crown);
}

float rock(vec2 p, vec2 pos, float scale) {
  vec2 q = (p - pos) / scale;
  float d = length(q * vec2(1.0, 1.35));
  d += 0.15 * fbm(q * 3.0);
  return 1.0 - smoothstep(0.55, 0.85, d);
}

float tent(vec2 p, vec2 pos, float scale) {
  vec2 q = (p - pos) / scale;
  // A-frame
  float roof = max(1.0 - (abs(q.x) * 1.6 + q.y * 1.1), 0.0);
  roof *= smoothstep(-0.05, 0.0, q.y) * smoothstep(0.95, 0.35, q.y);
  float pole = 1.0 - smoothstep(0.02, 0.045, abs(q.x));
  pole *= smoothstep(-0.02, 0.05, q.y) * smoothstep(0.9, 0.2, q.y);
  return max(roof * 0.85, pole * 0.5);
}

void main() {
  vec2 res = u_resolution;
  vec2 fc = gl_FragCoord.xy;
  // câmera afastada: zoom base baixo + fire menor no quadro
  vec2 uv = (fc - 0.5 * res) / res.y;
  uv /= max(u_zoom, 0.25);
  uv.x -= (u_mouse.x / res.x - 0.5) * 1.2;
  uv.y -= (u_mouse.y / res.y - 0.5) * 0.7;
  // horizonte ~1/3 inferior
  uv.y += 0.12;

  float t = T;

  // —— céu noturno ——
  vec3 col = vec3(0.015, 0.02, 0.04);
  col = mix(col, vec3(0.04, 0.05, 0.08), smoothstep(-0.15, 0.55, uv.y));
  // estrelas discretas
  float st = step(0.9965, hash(floor(fc * 0.55)));
  col += st * vec3(0.7, 0.75, 0.85) * (0.35 + 0.65 * hash(fc.yx));
  // Via Láctea suave
  float mw = exp(-pow((uv.x * 0.4 + uv.y * 0.9 - 0.35), 2.0) * 8.0);
  col += mw * vec3(0.08, 0.09, 0.14) * (0.4 + 0.4 * fbm(uv * 3.0));

  // lua
  vec2 moonP = vec2(-0.85, 0.62);
  float moonD = length(uv - moonP);
  float moon = smoothstep(0.07, 0.045, moonD);
  moon += 0.35 * exp(-moonD * 12.0);
  moon += 0.12 * exp(-moonD * 4.0);
  col += moon * vec3(0.9, 0.9, 0.88);

  // —— chão / clareira ——
  float groundY = -0.18;
  float groundMask = smoothstep(0.02, -0.02, uv.y - groundY);
  // perspectiva simples no chão
  vec2 gp = vec2(uv.x / max(0.15 - uv.y, 0.08), (groundY - uv.y) * 4.0);
  float dirt = fbm(gp * 2.5);
  float leaves = fbm(gp * 7.0 + 4.2);
  vec3 groundCol = mix(vec3(0.05, 0.04, 0.025), vec3(0.09, 0.07, 0.035), dirt);
  groundCol = mix(groundCol, vec3(0.06, 0.08, 0.03), leaves * 0.35);
  // pedrinhas
  groundCol += vec3(0.04) * step(0.92, noise(gp * 14.0)) * 0.5;

  // luz da fogueira no chão (queda realista)
  vec2 fireWorld = vec2(0.0, groundY + 0.02);
  float distFire = length(uv - fireWorld);
  float light = exp(-distFire * 2.8) * (0.55 + 0.2 * sin(t * 4.0 + fbm(uv * 2.0) * 3.0));
  light *= groundMask;
  groundCol += vec3(0.55, 0.22, 0.05) * light * 1.1;
  groundCol += vec3(0.25, 0.08, 0.01) * exp(-distFire * 1.2) * groundMask * 0.35;

  col = mix(col, groundCol, groundMask);

  // —— floresta de fundo (silhuetas) ——
  float forest = 0.0;
  forest = max(forest, pineTree(uv, vec2(-1.35, groundY), 0.95));
  forest = max(forest, pineTree(uv, vec2(-1.05, groundY), 0.72));
  forest = max(forest, pineTree(uv, vec2(-0.72, groundY), 1.05));
  forest = max(forest, pineTree(uv, vec2(0.78, groundY), 0.88));
  forest = max(forest, pineTree(uv, vec2(1.08, groundY), 1.12));
  forest = max(forest, pineTree(uv, vec2(1.42, groundY), 0.7));
  // fila distante mais baixa
  for (float i = -4.0; i <= 4.0; i++) {
    float x = i * 0.38 + 0.05 * sin(i * 2.1);
    if (abs(x) < 0.35) continue;
    forest = max(forest, pineTree(uv, vec2(x, groundY - 0.01), 0.45 + 0.12 * hash(vec2(i, 2.0))));
  }
  vec3 forestCol = vec3(0.01, 0.015, 0.02);
  // beira das árvores levemente aquecida pela fogueira
  forestCol += vec3(0.12, 0.05, 0.015) * exp(-abs(uv.x) * 1.4) * light * 0.8;
  col = mix(col, forestCol, clamp(forest, 0.0, 1.0) * 0.95);

  // pedras ao redor da fogueira
  float rocks = 0.0;
  rocks = max(rocks, rock(uv, vec2(-0.22, groundY + 0.01), 0.09));
  rocks = max(rocks, rock(uv, vec2(0.20, groundY), 0.07));
  rocks = max(rocks, rock(uv, vec2(-0.12, groundY - 0.01), 0.055));
  rocks = max(rocks, rock(uv, vec2(0.14, groundY + 0.015), 0.06));
  vec3 rockCol = vec3(0.08, 0.07, 0.06) + vec3(0.35, 0.15, 0.04) * light * 1.5;
  rockCol += 0.04 * fbm(uv * 40.0);
  col = mix(col, rockCol, rocks * 0.9);

  // tenda ao fundo-esquerda
  float tn = tent(uv, vec2(-0.55, groundY), 0.38);
  vec3 tentCol = vec3(0.06, 0.05, 0.04);
  tentCol += vec3(0.2, 0.08, 0.02) * light * 0.6;
  // entrada levemente iluminada por dentro
  float door = smoothstep(0.12, 0.0, abs(uv.x + 0.55)) * smoothstep(groundY, groundY + 0.25, uv.y) * tn;
  tentCol += vec3(0.4, 0.18, 0.05) * door * 0.35;
  col = mix(col, tentCol, tn * 0.88);

  // —— fogueira (menor / coords locais) ——
  vec2 fp = (uv - fireWorld) * vec2(2.6, 2.4);
  fp.y += 0.02;
  float dens = 0.0;
  for (float i = 0.0; i < 6.0; i++) {
    float z = i / 6.0;
    vec2 p = fp;
    p.x *= 1.0 + z * 0.15;
    p.y += z * 0.02;
    dens += fireField(p, t + z * 0.4) * (1.0 - z * 0.12);
  }
  dens /= 4.2;

  vec3 fire = firePalette(dens * 1.15);
  float halo = fireField(vec2(fp.x * 0.7, fp.y * 0.85), t * 0.7) * 0.5;
  fire += firePalette(halo * 0.7) * 0.3;
  fire += vec3(1.0, 0.3, 0.02) * dens * dens * 0.5;

  float em = emberGlow(fp, t);
  fire += vec3(1.0, 0.07, 0.2) * em * 1.4;
  fire += vec3(0.53, 0.07, 0.0) * em * 0.5;
  float blueLick = dens * smoothstep(0.18, -0.02, fp.y) * smoothstep(0.25, 0.0, abs(fp.x));
  fire += vec3(0.55, 0.75, 1.0) * blueLick * 0.15;

  float sp = 0.0;
  for (float i = 0.0; i < 10.0; i++) sp += spark(fp, t, i + 1.0);
  fire += vec3(1.0, 0.55, 0.15) * sp * 1.4;

  // gravetos
  float sticks = stickMask(fp);
  vec3 wood = vec3(0.04, 0.025, 0.015) + vec3(0.5, 0.12, 0.02) * em * 0.8;
  col = mix(col, wood, sticks * 0.92);

  // glow atmosférico local (fumaça/calor)
  float heat = exp(-distFire * 3.5) * (0.08 + 0.04 * dens);
  col += vec3(0.35, 0.12, 0.02) * heat;

  col += fire;

  // névoa baixa na clareira
  float mist = groundMask * (1.0 - groundMask * 0.3) * 0.12 * fbm(vec2(uv.x * 2.0 - t * 0.05, uv.y * 4.0));
  col = mix(col, vec3(0.08, 0.07, 0.06), mist);

  float vig = smoothstep(1.55, 0.4, length(uv * vec2(0.7, 0.9)));
  col *= vig;
  col = tanh(col * 1.1);
  fragColor = vec4(col, 1.0);
}
</script>

<script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
  document.body.textContent = 'WebGL2 não suportado neste navegador.';
  throw new Error('WebGL2');
}
function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}
const program = gl.createProgram();
gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, document.getElementById('vertex-shader').text));
gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, document.getElementById('fragment-shader').text));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(program));
gl.useProgram(program);

const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const positionLocation = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(positionLocation);
gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

const resLocation = gl.getUniformLocation(program, 'u_resolution');
const timeLocation = gl.getUniformLocation(program, 'u_time');
const mouseLocation = gl.getUniformLocation(program, 'u_mouse');
const zoomLocation = gl.getUniformLocation(program, 'u_zoom');

let mouse = { x: 0, y: 0 };
// mais afastado por padrão
let zoom = 0.55;
let dragging = false, last = null;

function setMouseFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  mouse.x = (src.clientX - rect.left) * (canvas.width / rect.width);
  mouse.y = (rect.bottom - src.clientY) * (canvas.height / rect.height);
}
canvas.addEventListener('pointerdown', (e) => {
  dragging = true; last = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId); setMouseFromEvent(e);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) { setMouseFromEvent(e); return; }
  if (last) {
    mouse.x += (e.clientX - last.x) * (canvas.width / canvas.clientWidth);
    mouse.y -= (e.clientY - last.y) * (canvas.height / canvas.clientHeight);
  }
  last = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', () => { dragging = false; last = null; });
canvas.addEventListener('pointercancel', () => { dragging = false; last = null; });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoom *= e.deltaY > 0 ? 0.92 : 1.08;
  zoom = Math.min(2.2, Math.max(0.28, zoom));
}, { passive: false });

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  if (mouse.x === 0 && mouse.y === 0) {
    mouse.x = canvas.width * 0.5;
    mouse.y = canvas.height * 0.45;
  }
}
window.addEventListener('resize', resize);
resize();

function render(time) {
  if (canvas.width !== Math.floor(window.innerWidth * Math.min(devicePixelRatio || 1, 2))) resize();
  gl.uniform2f(resLocation, canvas.width, canvas.height);
  gl.uniform1f(timeLocation, time * 0.001);
  gl.uniform2f(mouseLocation, mouse.x, mouse.y);
  gl.uniform1f(zoomLocation, zoom);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
